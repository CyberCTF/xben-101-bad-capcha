# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-101-24 Bad Capcha (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask registration form protected by a CAPTCHA that is impossible to read in full.
# The benchmark folder benchmarks/XBEN-101-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-101-bad-capcha

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.144.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 8000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the Bad Capcha page answers
    http: http://web:8000/
    wait: 180
  - name: the form hands out its encrypted CAPTCHA cookie
    script: checks/probe.sh
    wait: 60

message: |
  Bad Capcha answers at {{ machines.web.ports.web.url }}.
  The CAPTCHA can't be read in full. Can you still create a user?
